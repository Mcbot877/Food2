    <script>
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var fetchHolder = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder;
            },
            set: function(val) {
              fetchHolder = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            if (realFetch) {
              Object.defineProperty(window, 'fetch', {
                value: realFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        }
      })();
    </script>
